name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Add native sensor and manifest configuration
        run: python3 scripts/patch_android.py

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Use the persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64 repository secret to the persistent Android signing key."
            exit 1
          fi
          mkdir -p ~/.android
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android >/dev/null
          CERTIFICATE_FINGERPRINT=$(keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | awk -F': ' '/SHA256:/ { print $2; exit }' | tr -d ':')
          EXPECTED_FINGERPRINT="2523B414F6B2B3C4151C9E92725E1577349A8DEF4658D30EF50237DEB479D658"
          if [ "$CERTIFICATE_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::The signing key does not match the certificate used by the current APK. Refusing to build an APK that cannot update it."
            exit 1
          fi

      - name: Set version from the build number
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          VERSION_CODE=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))
          VERSION_NAME="${BASE_VERSION}.${{ github.run_number }}.${{ github.run_attempt }}"
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/; s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Name the installable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FG-Ops.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FG-Ops-APK
          path: FG-Ops.apk
          if-no-files-found: error

      - name: Publish the APK for direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          VERSION_NAME="${BASE_VERSION}.${{ github.run_number }}.${{ github.run_attempt }}"
          gh release create "apk-v${VERSION_NAME}" FG-Ops.apk \
            --title "FG Ops ${VERSION_NAME}" \
            --notes "Install this APK on Android to update the existing app. Keep the app installed; this build uses the same persistent signing key." \
            --latest